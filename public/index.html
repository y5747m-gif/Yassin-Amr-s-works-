<script>
  /* set language + direction + device performance profile before first paint (no flash) */
  (function () {
    try {
      var root = document.documentElement;
      var saved = localStorage.getItem('twe-lang');
      var lang = saved || ((navigator.language || 'en').toLowerCase().startsWith('ar') ? 'ar' : 'en');
      root.lang = lang;
      root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      if (sessionStorage.getItem('twe-intro-seen')) root.classList.add('intro-skip');

      var cores = navigator.hardwareConcurrency || 8;
      var mem = navigator.deviceMemory || 8;
      var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      var slowNet = Boolean(conn && (conn.saveData || /^(slow-2g|2g|3g)$/i.test(conn.effectiveType || '')));
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (cores <= 2 || mem <= 2 || slowNet || (coarse && (cores <= 4 || mem <= 4))) {
        root.classList.add('perf-lite');
      }
    } catch (e) {}
  })();
</script>
